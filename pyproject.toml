[project]
name = "ai-chat-export"
version = "0.1.0"
description = "Export Cursor and Copilot sessions to HTML and Markdown"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
ai-chat-export = "ai_chat_export.__main__:main"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project.optional-dependencies]
dev = ["ruff>=0.8"]

[tool.setuptools.packages.find]
include = ["ai_chat_export*"]

[tool.ruff]
target-version = "py311"
# Existing modules and embedded CSS already use lines this long.
line-length = 180

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "N"]
